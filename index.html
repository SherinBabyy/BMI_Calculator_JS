<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calculator</title>
    <link
      rel="shortcut icon"
      href="https://static.vecteezy.com/system/resources/previews/029/890/649/non_2x/indikator-bmi-on-white-background-chart-concept-icon-vector.jpg"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-danger">
    <div class="d-flex flex-column align-items-center justify-content-center">
      <div class="d-flex flex-column align-items-center mt-5 text-light">
        <h1>BMI Calculator</h1>
      </div>

      <div
        style="height: 50vh"
        class="bg-light d-flex flex-column gap-4 p-4 mt-5 fs-5 w-25 text-secondary"
      >
        <div>
          <label for="">Weight</label>
          <input
            id="inputWeight"
            type="text"
            placeholder="Enter your weight in kg"
            class="form-control"
          />
        </div>
        <div>
          <label for="">Height</label>
          <input
            id="inputHeight"
            type="text"
            placeholder="Enter your height in cm"
            class="form-control"
          />
        </div>
        <h1 class="d-flex flex-column align-items-center"></h1>
        <button
          id="Btn"
          class="btn btn-outline-danger fs-4"
          onclick="onCalcBtnClick()"
        >
          Calculate
        </button>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
